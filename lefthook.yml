pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{js,ts,svelte,css,html,json,md,yml,yaml}"
      run: bunx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{js,ts,svelte}"
      run: SVELTE_ESLINT_PARSER_EXPERIMENTAL_TS_SYS_HOOK=1 bunx eslint {staged_files}
    - name: typecheck
      run: bun run typecheck
    - name: test
      run: bun test
    - name: knip
      run: bun run knip
